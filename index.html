<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>王者轮回抽奖模拟器</title>
<style>
:root{
  --primary-color: #4a8c5f;
  --primary-color-rgb: 74,140,95;
  --primary-color-light: #5fa875;
  --accent-color: #7dd89a;
  --accent-color: var(--accent-color);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
.stage{position:absolute;top:50%;left:50%;width:2340px;height:1080px;margin:-540px 0 0 -1170px;transform-origin:center center;cursor:pointer}
.layer{position:absolute;inset:0;width:2340px;height:1080px;pointer-events:none;user-select:none;-webkit-user-drag:none;display:block}
.layer-bg{z-index:1}
.layer-weapon{z-index:2;animation:weaponFloat 4s ease-in-out infinite;will-change:transform;filter:drop-shadow(0 0 25px rgba(100,140,255,.3))}
@keyframes weaponFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.btn-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:20px;transition:transform .12s ease,background .12s ease}
.hotspot:active{transform:scale(.93);background:rgba(var(--primary-color-rgb),.12)}
.hotspot.pulse{animation:btnPulse 2s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--primary-color-rgb),.5)}50%{box-shadow:0 0 0 18px rgba(var(--primary-color-rgb),0)}}
.ripple{position:absolute;border-radius:50%;border:3px solid rgba(var(--primary-color-rgb),.9);background:radial-gradient(circle,rgba(255,220,100,.25) 0%,rgba(var(--primary-color-rgb),.08) 60%,transparent 100%);transform:translate(-50%,-50%) scale(0);animation:rippleExpand .7s cubic-bezier(.1,.8,.3,1) forwards;pointer-events:none;z-index:100;box-shadow:0 0 24px rgba(var(--primary-color-rgb),.5),0 0 48px rgba(var(--primary-color-rgb),.25)}
@keyframes rippleExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(7);opacity:0}}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:100}
.flash{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,210,.9) 0%,rgba(255,220,100,.35) 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:flashBurst .55s ease-out forwards;pointer-events:none;z-index:99}
@keyframes flashBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.6);opacity:.7}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.shockwave{position:absolute;border-radius:50%;border:2px solid rgba(255,230,120,.6);transform:translate(-50%,-50%) scale(0);animation:shockwaveExpand .8s ease-out forwards;pointer-events:none;z-index:98}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:.8}100%{transform:translate(-50%,-50%) scale(10);opacity:0}}

.hotspot,
.hotspot:active,
.hotspot:hover,
.hotspot:focus,
.hotspot.pulse,
.hotspot.selected{
  border:none!important;
  background:transparent!important;
  outline:none!important;
  box-shadow:none!important;
  animation:none!important;
}
.hotspot-label{display:none!important}

.exchange-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:center;justify-content:center}
.exchange-modal.active{display:flex}
.exchange-box{position:relative;width:92%;height:88%;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.8)}
.exchange-box iframe{width:100%;height:100%;border:none;display:block;background:#000}

.fs-btn{position:fixed;top:12px;right:12px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid rgba(var(--primary-color-rgb),.5);color:var(--primary-color);font-size:26px;cursor:pointer;z-index:10000000;display:flex;align-items:center;justify-content:center;transition:all .2s}

/* 背景音乐音量调节（垂直） */
.bgm-volume-control{position:fixed;top:72px;right:12px;width:32px;height:120px;background:rgba(0,0,0,.65);border:1px solid rgba(var(--primary-color-rgb),.4);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 0;z-index:10000000;transition:all .2s}
.bgm-volume-control:hover{background:rgba(0,0,0,.8);border-color:rgba(var(--primary-color-rgb),.7)}
.bgm-volume-icon{font-size:14px;margin-bottom:6px;flex-shrink:0}
.bgm-volume-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer;transform:rotate(-90deg);transform-origin:center center;margin-top:30px}
.bgm-volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary-color);cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(var(--primary-color-rgb),.6)}
.bgm-volume-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--primary-color);cursor:pointer;border:2px solid #fff;box-shadow:0 0 4px rgba(var(--primary-color-rgb),.6)}
/* 全屏时隐藏全屏按钮和音量调节 */
:fullscreen .fs-btn, :fullscreen .bgm-volume-control,
:-webkit-full-screen .fs-btn, :-webkit-full-screen .bgm-volume-control{display:none !important}
/* 页面说明文字 */
.page-info{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#ccc;font-size:11px;line-height:1.5;padding:6px 20px;z-index:10000000;text-align:left}
.disclaimer-box{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#999;font-size:11px;line-height:1.6;padding:10px 20px;z-index:10000000;text-align:left;border-top:1px solid rgba(255,255,255,0.1)}
.page-info .title{color:var(--primary-color);font-size:12px;font-weight:bold;margin-bottom:2px}
.page-info .guide{margin-bottom:2px}
.page-info .guide p{margin:0}
.page-info .disclaimer{color:#999;font-size:11px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px}
.fs-btn:hover{background:rgba(var(--primary-color-rgb),.2);transform:scale(1.1)}
.fs-btn:active{transform:scale(.92)}
body.is-fullscreen .fs-btn{display:none!important}
body.is-fullscreen .page-info{display:none!important}
body.is-fullscreen .disclaimer-box{display:none!important}

.gacha-single-modal{position:fixed;inset:0;background:#000;z-index:100003;display:none;align-items:center;justify-content:center}
.gacha-single-modal.gacha-show{display:flex!important}
.gacha-single-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.gacha-single-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.gacha-ten-modal{position:fixed;inset:0;background:#000;z-index:100004;display:none;align-items:center;justify-content:center}

.shop-modal.shop-show{display:flex!important}

.shop-tpl{display:none!important}
.recharge-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100006;display:none;align-items:center;justify-content:center}
.recharge-modal.recharge-show{display:flex!important}
.recharge-box{position:relative;width:100vw;height:calc(100vw * 1080 / 2340);max-height:100vh;max-width:calc(100vh * 2340 / 1080);background:#000;overflow:hidden}
.recharge-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100007;display:none;align-items:center;justify-content:center}
.confirm-modal.confirm-show{display:flex!important}
.confirm-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}
.confirm-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.payment-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100008;display:none;align-items:center;justify-content:center}
.payment-modal.payment-show{display:flex!important}
.payment-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}
.payment-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.exchange-confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100009;display:none;align-items:center;justify-content:center}
.exchange-confirm-modal.exchange-confirm-show{display:flex!important}
.exchange-confirm-box{position:relative;width:100vw;height:calc(100vw * 1344 / 2912);max-height:100vh;max-width:calc(100vh * 2912 / 1344);background:#000;overflow:hidden}
.exchange-confirm-box iframe{width:100%;height:100%;border:none;display:block;background:#000}
.reward-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.reward-modal.show{display:block}
#rewardIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.storage-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.storage-modal.show{display:block}
#storageIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.decompose-reward-modal{position:fixed;inset:0;z-index:600;display:none;background:rgba(0,0,0,0.85)}
.warehouse-multi-modal{position:fixed;inset:0;z-index:600;display:none;background:rgba(0,0,0,0.85)}

#warehouseMultiIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.warehouse-modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,0.85)}
.storage-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.warehouse-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.warehouse-modal.show{display:block}
.decompose-reward-modal.show{display:block}
#decomposeRewardIframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* 购买抽奖币成功弹窗 */
.buy-success-modal{position:fixed;inset:0;z-index:999999;background:#000;display:none;align-items:center;justify-content:center}

/* ===== 灰蓝金属确认弹窗（兑换失败用） ===== */
.sb-confirm-panel{
  width:45%;max-width:500px;
  background:linear-gradient(160deg,#8a92a8 0%,#6a7288 30%,#5a6278 60%,#4a5268 100%);
  border-radius:4px;
  position:relative;overflow:hidden;
  padding:4vh 3vw 3vh;
  box-shadow:0 0 60px rgba(0,0,0,0.6);
}
.sb-confirm-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#c03030,#e04040,#c03030);
}
.sb-confirm-cflogo{
  position:absolute;top:1.5vh;left:2vw;
  font-size:3vh;font-weight:bold;color:#d04040;
  opacity:0.6;letter-spacing:1px;
}
.sb-confirm-content{
  text-align:center;padding:3vh 0;
}

}

}
.sb-btn-gold{

  border:1px solid #805010;border-radius:3px;

  cursor:pointer;
  box-shadow:0 0.4vh 1.5vh rgba(200,150,30,0.4);
}
.sb-btn-gold:active{transform:scale(0.97);}

/* ===== 王者轮回轮盘样式 ===== */
.drawn-check{position:absolute;width:42px;height:42px;border-radius:50%;background:#000;border:3px solid #2db84d;display:flex;align-items:center;justify-content:center;z-index:15;box-shadow:0 0 8px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.3s;pointer-events:none}
.drawn-check::after{content:"";width:20px;height:12px;border-left:4px solid #2db84d;border-bottom:4px solid #2db84d;transform:rotate(-45deg) translate(2px,-2px)}
.drawn-check.show{opacity:1}
.track-marker{position:absolute;z-index:15;width:90px;height:90px;pointer-events:none;transform:translate(-50%,-50%);}
.track-marker::before{content:'';position:absolute;left:50%;top:50%;width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,215,0,0.7);transform:translate(-50%,-50%);animation:markerPulse 0.8s ease-in-out infinite;}
.track-marker::after{content:'';position:absolute;left:50%;top:50%;width:140px;height:140px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,240,120,0.9) 0%,rgba(255,210,0,0.6) 25%,rgba(255,170,0,0.3) 50%,rgba(255,140,0,0.1) 70%,transparent 80%);animation:markerGlow 1.0s ease-in-out infinite;pointer-events:none;}
@keyframes markerPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6;}50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.3;}}
@keyframes markerGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7;}50%{transform:translate(-50%,-50%) scale(1.25);opacity:1;}}
.marker-trail{position:absolute;z-index:14;width:45px;height:45px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,120,0.75),rgba(255,180,0,0.35) 40%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);animation:trailFade 0.6s ease-out forwards;}
.diamond-particle{position:absolute;z-index:14;width:12px;height:12px;background:linear-gradient(135deg,#fffacd,#ffd700,#daa520);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 10px #ffd700,0 0 20px rgba(255,200,0,0.5);pointer-events:none;animation:particleFly 0.5s ease-out forwards;}
.land-flash{position:absolute;z-index:14;width:300px;height:300px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,230,1) 0%,rgba(255,230,80,0.9) 20%,rgba(255,200,0,0.7) 40%,rgba(255,160,0,0.4) 60%,rgba(255,120,0,0.15) 80%,transparent 90%);animation:flashBurst 0.8s ease-out forwards;}
.burst-ring{position:absolute;z-index:13;width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,220,80,0.9);pointer-events:none;transform:translate(-50%,-50%);animation:ringExpand 0.8s ease-out forwards;}
.light-rays{position:absolute;z-index:13;width:700px;height:700px;pointer-events:none;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,0.5) 5deg,transparent 15deg,transparent 30deg,rgba(255,200,0,0.4) 35deg,transparent 45deg,transparent 60deg,rgba(255,215,0,0.5) 65deg,transparent 75deg,transparent 90deg,rgba(255,200,0,0.4) 95deg,transparent 105deg,transparent 120deg,rgba(255,215,0,0.5) 125deg,transparent 135deg,transparent 150deg,rgba(255,200,0,0.4) 155deg,transparent 165deg,transparent 180deg,rgba(255,215,0,0.5) 185deg,transparent 195deg,transparent 210deg,rgba(255,200,0,0.4) 215deg,transparent 225deg,transparent 240deg,rgba(255,215,0,0.5) 245deg,transparent 255deg,transparent 270deg,rgba(255,200,0,0.4) 275deg,transparent 285deg,transparent 300deg,rgba(255,215,0,0.5) 305deg,transparent 315deg,transparent 330deg,rgba(255,200,0,0.4) 335deg,transparent 345deg);animation:rayExpand 0.8s ease-out forwards;}
.screen-gold-glow{position:absolute;z-index:12;left:0;top:0;width:2340px;height:1080px;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,215,0,0.28),transparent 65%);animation:glowFade 1s ease-out forwards;}
@keyframes trailFade{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}}
@keyframes flashBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3);}40%{opacity:0.9;transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(2);}}
@keyframes rayExpand{0%{opacity:0.8;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(25deg);}}
@keyframes glowFade{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}
@keyframes ringExpand{0%{transform:translate(-50%,-50%) scale(0.5);opacity:1;}100%{transform:translate(-50%,-50%) scale(4);opacity:0;}}
@keyframes particleFly{0%{transform:translate(-50%,-50%) rotate(45deg) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(45deg) scale(0.2);opacity:0;}}
@keyframes trailFade{0%{opacity:0.8;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}}

@keyframes landBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3);}50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5);}}
.land-flash{position:absolute;z-index:16;border-radius:50%;background:radial-gradient(circle,rgba(255,255,200,0.95) 0%,rgba(255,200,50,0.6) 25%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);animation:landFlash 0.8s ease-out forwards;}
@keyframes landFlash{0%{width:20px;height:20px;opacity:1;}100%{width:350px;height:350px;opacity:0;}}
.land-ring{position:absolute;z-index:16;border-radius:50%;border:3px solid rgba(255,215,0,0.8);pointer-events:none;transform:translate(-50%,-50%);animation:landRing 1s ease-out forwards;}
@keyframes landRing{0%{width:30px;height:30px;opacity:1;}100%{width:280px;height:280px;opacity:0;}}
.land-particle{position:absolute;z-index:17;width:8px;height:8px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);}
.screen-flash{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at center,rgba(255,220,100,0.45) 0%,transparent 60%);pointer-events:none;opacity:0;}
.screen-flash.go{animation:screenFlash 0.5s ease-out;}
@keyframes screenFlash{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.btn-layer{position:absolute;inset:0;z-index:10;pointer-events:none;}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:8px;transition:transform 0.1s;}

.currency-display{position:absolute;z-index:20;color:#fff;font-size:34px;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,0.8);pointer-events:none;display:flex;align-items:center;gap:6px;}
.modal-mask{position:absolute;inset:0;z-index:100;background:rgba(5,3,15,0.9);display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.page-modal{position:absolute;inset:0;z-index:150;background-size:100% 100%;background-position:center;display:none;}
.page-modal.show{display:block;}

.page-content{position:absolute;inset:0;}
.reward-modal{position:fixed;inset:0;z-index:500;display:none;background:#000}
.reward-modal.show{display:block}
.reward-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}

.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;z-index:2;}
.modal-title{font-size:36px;font-weight:bold;color:#fff;letter-spacing:4px;text-shadow:0 2px 8px rgba(0,0,0,0.8);}
.modal-close{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-body{flex:1;overflow-y:auto;padding:30px 40px;z-index:2;}
.modal-body::-webkit-scrollbar{width:8px;}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px;}
.reward-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-top:20px;}
/* 奖励一览布局 */
.rl-left{position:absolute;left:230px;top:0;width:620px;height:100%;}
.rl-big{position:absolute;left:0;top:10px;width:340px;height:200px;display:flex;align-items:center;justify-content:center;}
.rl-big img{width:200px;height:200px;object-fit:contain;}
.rl-grid{position:absolute;left:0;top:230px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:540px;}
.rl-cell{width:170px;height:170px;display:flex;align-items:center;justify-content:center;}
.rl-cell img{width:130px;height:130px;object-fit:contain;}
.rl-right{position:absolute;right:80px;top:0;width:780px;height:100%;}
.rl-right-items{display:flex;gap:20px;margin-top:100px;}
.rl-right-item{width:220px;height:280px;background:rgba(40,40,50,0.6);position:relative;display:flex;flex-direction:column;align-items:center;}
.rl-right-name{font-size:24px;color:#fff;font-weight:bold;padding:15px 10px;text-align:left;width:100%;}
.rl-right-item img{width:140px;height:140px;object-fit:contain;margin-top:10px;}
.rl-right-num{position:absolute;bottom:15px;right:20px;font-size:32px;color:#fff;font-weight:bold;}
.rl-detail{position:absolute;bottom:60px;left:0;right:0;}
.rl-detail-name{font-size:36px;color:#fff;font-weight:bold;background:linear-gradient(90deg,rgba(80,160,80,0.8),transparent);padding:8px 20px;margin-bottom:10px;}
.rl-detail-desc{font-size:22px;color:#ccc;line-height:1.5;padding:0 20px;}
.reward-item{background:linear-gradient(145deg,rgba(30,25,50,0.7),rgba(15,12,30,0.8));border:1px solid rgba(140,100,220,0.35);border-radius:10px;padding:15px 10px;text-align:center;backdrop-filter:blur(4px);}
.reward-item.gold{border-color:rgba(255,200,60,0.5);}
.reward-item.white{border-color:rgba(150,200,255,0.5);}
.reward-icon{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.reward-icon img{width:80%;height:80%;object-fit:contain;}
.reward-name{font-size:18px;color:#e0d8f0;line-height:1.3;min-height:48px;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.reward-item.gold .reward-name{color:#ffd060;}
.reward-item.white .reward-name{color:#a0d0ff;}
.wh-empty{text-align:center;color:#aaa;font-size:28px;padding:80px 0;text-shadow:0 2px 4px rgba(0,0,0,0.8);}
.wh-section{margin-bottom:25px;}
.wh-section-title{font-size:26px;font-weight:bold;margin-bottom:12px;padding-left:12px;border-left:4px solid;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.wh-section-title.gold{color:#ffd060;border-color:#ffd060;}
.wh-section-title.white{color:#a0d0ff;border-color:#a0d0ff;}
.wh-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.wh-item{background:linear-gradient(145deg,rgba(30,25,50,0.7),rgba(15,12,30,0.8));border:1px solid rgba(140,100,220,0.3);border-radius:8px;padding:12px 8px;text-align:center;}
.wh-icon{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:5px;}
.wh-icon img{width:75%;height:75%;object-fit:contain;}
.wh-name{font-size:16px;color:#d8d0e8;line-height:1.2;min-height:40px;}
.storage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:60px;margin-bottom:40px;}
.storage-item{background:linear-gradient(145deg,rgba(30,25,50,0.7),rgba(15,12,30,0.8));border:2px solid rgba(140,100,220,0.35);border-radius:10px;padding:15px 10px;text-align:center;}
.storage-item.gold{border-color:rgba(255,200,60,0.5);}
.storage-item.white{border-color:rgba(150,200,255,0.5);}
.si-icon{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}

<script>


// ============================================================
// ===== 王者轮回轮盘抽奖系统（整合自王者轮回单文件） =====
// ============================================================

// ----- 配置变量 -----
// 10个轮盘道具配置（x/y坐标、品质、分解积分、概率）
const WHEEL_TRACK = [
  {"key": "王者自选-炫闪宝箱", "x": 745, "y": 125, "quality": "gold", "decompose": 30, "prob": 0.0001, "displayProb": "0.0001%"},
  {"key": "近战自选-炫闪宝箱", "x": 625, "y": 260, "quality": "gold", "decompose": 25, "prob": 0.001, "displayProb": "0.001%"},
  {"key": "英雄自选-炫闪宝箱", "x": 715, "y": 450, "quality": "gold", "decompose": 17, "prob": 0.05, "displayProb": "0.05%"},
  {"key": "10000点积分", "x": 915, "y": 610, "quality": "gold", "decompose": 12, "prob": 0.55, "displayProb": "0.6%"},
  {"key": "英雄之钥5", "x": 1125, "y": 730, "quality": "gold", "decompose": 10, "prob": 0.55, "displayProb": "0.6%"},
  {"key": "钻石8888", "x": 1375, "y": 790, "quality": "white", "decompose": 10, "prob": 0.75, "displayProb": "0.8%"},
  {"key": "5000点积分", "x": 1520, "y": 770, "quality": "gold", "decompose": 6, "prob": 0.95, "displayProb": "1.0%"},
  {"key": "典藏之骰5", "x": 1560, "y": 555, "quality": "gold", "decompose": 3, "prob": 4.25, "displayProb": "4.3%"},
  {"key": "钻石2888", "x": 1165, "y": 180, "quality": "white", "decompose": 1, "prob": 32.35, "displayProb": "32.4%"},
  {"key": "钻石888", "x": 965, "y": 130, "quality": "white", "decompose": 1, "prob": 60.5489, "displayProb": "61%"}
];

// 10次抽奖递增价格（总计319）
const WHEEL_DRAW_PRICES = [2, 5, 8, 15, 25, 24, 30, 48, 76, 86];

// 抽奖BGM的tick时间点（秒），从视频音频波形分析得到
const WHEEL_DRAW_TICKS = [0.600,0.800,0.950,1.199,1.449,1.649,1.899,2.149,2.349,2.599,2.799,2.949,3.149,3.299,3.498,3.648,3.848,4.248,4.798,5.048];
const WHEEL_DRAW_STOP_TIME = 5.348;    // BGM停止时间（标记落地+爆炸）
const WHEEL_DRAW_RESULT_TIME = 6.200;  // 结果弹窗显示时间（BGM余韵结束后）

// 出货动画背景图
const WHEEL_SLOT_WHITE = 'images/common/pages/gacha/slot_white.png';
const WHEEL_SLOT_GOLD = 'images/common/pages/gacha/slot_gold.png';
const WHEEL_RESULT_BG = 'images/common/pages/gacha/result_bg.png';

// 轮盘全局状态
var wheelState = {
  markerPos: 0,      // 标记当前位置
  drawing: false,     // 是否正在抽奖中（状态锁）
  drawCount: 0,       // 已抽奖次数（用于递增价格）
  drawn: []           // 已抽中的道具索引数组（不放回抽奖）
};

// 抽奖BGM单例
var wheelDrawBgmAudio = null;
function getWheelDrawBgm(){
  if(!wheelDrawBgmAudio){
    wheelDrawBgmAudio = new Audio('audio/gacha/draw_bgm.m4a');
    wheelDrawBgmAudio.preload = 'auto';
  }
  return wheelDrawBgmAudio;
}

// ----- 核心函数 -----

// 不放回概率选择：只从剩余道具中按概率选
function wheelPickRewardByProb(){
  var available = [];
  for(var i=0; i<WHEEL_TRACK.length; i++){
    if(wheelState.drawn.indexOf(i) === -1) available.push(i);
  }
  if(available.length === 0) return -1;
  var total = 0;
  for(var j=0; j<available.length; j++){ total += WHEEL_TRACK[available[j]].prob; }
  var r = Math.random() * total;
  var acc = 0;
  for(var j=0; j<available.length; j++){
    acc += WHEEL_TRACK[available[j]].prob;
    if(r < acc) return available[j];
  }
  return available[available.length-1];
}

// 更新已抽对勾标记
function wheelUpdateCheckMarks(){
  for(var i=0;i<WHEEL_TRACK.length;i++){
    var el=document.getElementById('check'+i);
    if(el){
      el.style.left=(WHEEL_TRACK[i].x+35)+'px';
      el.style.top=(WHEEL_TRACK[i].y-25)+'px';
      if(wheelState.drawn.indexOf(i)>-1) el.classList.add('show');
      else el.classList.remove('show');
    }
  }
}

// 设置标记位置
function wheelSetMarker(pos){
  var marker = document.getElementById('trackMarker');
  var t = WHEEL_TRACK[pos % WHEEL_TRACK.length];
  marker.style.left = t.x + 'px';
  marker.style.top = t.y + 'px';
}

// 延时工具
function wheelSleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

// 生成拖尾特效（标记每移动一步调用一次）
function wheelSpawnTrail(x, y){
  var stage = document.getElementById('stage');
  // 4个菱形粒子向四周飞散（已去掉圆形拖尾小光圈）
  for(var i=0; i<4; i++){
    var p = document.createElement('div');
    p.className = 'diamond-particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    var sz = 6 + Math.random() * 8;
    p.style.width = sz + 'px';
    p.style.height = sz + 'px';
    var angle = Math.random() * Math.PI * 2;
    var dist = 25 + Math.random() * 45;
    p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    stage.appendChild(p);
    setTimeout(function(){ p.remove(); }, 520);
  }
}

// 生成落地爆炸特效（5层）
function wheelSpawnLandEffect(x, y){
  var stage = document.getElementById('stage');
  // 第1层：全屏金色辉光
  var glow = document.createElement('div');
  glow.className = 'screen-gold-glow';
  stage.appendChild(glow);
  setTimeout(function(){ glow.remove(); }, 1000);
  // 第2层：浓烈圆形爆发光环
  var ring = document.createElement('div');
  ring.className = 'burst-ring';
  ring.style.left = x + 'px';
  ring.style.top = y + 'px';
  stage.appendChild(ring);
  setTimeout(function(){ ring.remove(); }, 820);
  // 第3层：光线放射
  var rays = document.createElement('div');
  rays.className = 'light-rays';
  rays.style.left = x + 'px';
  rays.style.top = y + 'px';
  stage.appendChild(rays);
  setTimeout(function(){ rays.remove(); }, 800);
  // 第4层：中心闪光
  var flash = document.createElement('div');
  flash.className = 'land-flash';
  flash.style.left = x + 'px';
  flash.style.top = y + 'px';
  stage.appendChild(flash);
  setTimeout(function(){ flash.remove(); }, 700);
  // 第5层：16个菱形粒子爆炸
  for(var i=0; i<16; i++){
    var p = document.createElement('div');
    p.className = 'diamond-particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.animationDuration = '0.8s';
    var sz = 8 + Math.random() * 10;
    p.style.width = sz + 'px';
    p.style.height = sz + 'px';
    var angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.25;
    var dist = 90 + Math.random() * 140;
    p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    stage.appendChild(p);
    setTimeout(function(){ p.remove(); }, 820);
  }
}

// 显示出货动画（飞入小方块）


// 关闭出货动画



// 抽奖主函数（async，因为里面有大量await sleep）
function playWheelActionSfx(){
  if(!window._wheelActionSfx){
    window._wheelActionSfx = new Audio('audio/gacha/sfx_action.m4a');
    window._wheelActionSfx.preload = 'auto';
  }
  window._wheelActionSfx.currentTime = 0;
  window._wheelActionSfx.play().catch(function(){});
}
async function doDraw(){
  if(wheelState.drawing) return;
  var cost=WHEEL_DRAW_PRICES[Math.min(wheelState.drawCount,WHEEL_DRAW_PRICES.length-1)];
  if(gachaCoinCount<cost){ openShop(); return; }
  if(wheelState.drawn.length>=WHEEL_TRACK.length){ if(typeof showToast==='function') showToast('所有奖励已抽完！'); return; }
  playClickSound();
  wheelState.drawing=true;
  gachaCoinCount-=cost;
  wheelState.drawCount++;
  updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
  updateDrawCostDisplay(); // 更新抽奖按钮显示的轮回币数量
  // ===== 关键：在用户点击的同步上下文中预加载gacha_single.html，避免QQ浏览器拦截 =====
  isGachaAnimating = true;
  currentGachaType = 'single';
  var gachaModal = document.getElementById('gachaSingleModal');
  var gachaIframe = document.getElementById('gachaSingleIframe');
  gachaModal.classList.remove('gacha-show'); // 先隐藏，不显示
  // 标记iframe未加载完成
  wheelState.gachaIframeLoaded = false;
  // 设置onload回调，标记加载完成
  gachaIframe.onload = function(){
    wheelState.gachaIframeLoaded = true;
    // 如果轮盘动画已经结束（gachaPreloaded为false），立即发送奖励并显示
    if(!wheelState.gachaPreloaded && isGachaAnimating){
      sendGachaReward();
    }
  };
  // 立即设置iframe.src（在用户点击同步上下文中，不会被QQ浏览器拦截）
  gachaIframe.src = 'pages/gacha_single.html?t=' + Date.now();
  wheelState.gachaPreloaded = true;

  // 1. 先根据概率确定目标
  var targetIdx=wheelPickRewardByProb();
  var reward=WHEEL_TRACK[targetIdx];
  // 固定19步：起始位置=目标前19步，转19步后恰好到目标
  var totalSteps=19;
  var startIdx=(targetIdx-totalSteps+WHEEL_TRACK.length*10)%WHEEL_TRACK.length;

  // 2. 构建路径（从startIdx开始，19步后到targetIdx）
  var path=[];
  for(var i=0;i<=totalSteps;i++){ path.push((startIdx+i)%WHEEL_TRACK.length); }

  // 3. 标记显示在起始位置，立即迈出第一步（零停顿）
  var marker=document.getElementById('trackMarker');
  marker.style.left=WHEEL_TRACK[startIdx].x+'px';
  marker.style.top=WHEEL_TRACK[startIdx].y+'px';
  marker.style.opacity='1';
  // 立即移动到第一步
  var p1=path[1];
  marker.style.left=WHEEL_TRACK[p1].x+'px';
  marker.style.top=WHEEL_TRACK[p1].y+'px';
  wheelSpawnTrail(WHEEL_TRACK[p1].x,WHEEL_TRACK[p1].y);

  // 4. 音频从0.6s开始播（第一个tick立即触发，和标记第一步同步）
  var bgm=getWheelDrawBgm();
  bgm.currentTime=WHEEL_DRAW_TICKS[0];
  bgm.play().catch(function(){});

  // 5. 按tick间隔连续移动（从第二步开始，每步等tick间隔）
  var stepStart=performance.now();
  for(var ti=1;ti<WHEEL_DRAW_TICKS.length-1;ti++){
    var interval=WHEEL_DRAW_TICKS[ti]-WHEEL_DRAW_TICKS[ti-1];
    var pathIdx=ti+1;
    var pos=path[pathIdx];
    var x=WHEEL_TRACK[pos].x,y=WHEEL_TRACK[pos].y;
    var elapsed=(performance.now()-stepStart)/1000;
    var waitMs=(interval-elapsed)*1000;
    if(waitMs>0) await wheelSleep(waitMs);
    stepStart=performance.now();
    marker.style.left=x+'px';
    marker.style.top=y+'px';
    wheelSpawnTrail(x,y);
  }
  // 最后一步到停止时刻的间隔
  var lastInterval=WHEEL_DRAW_TICKS[WHEEL_DRAW_TICKS.length-1]-WHEEL_DRAW_TICKS[WHEEL_DRAW_TICKS.length-2];
  var elapsed=(performance.now()-stepStart)/1000;
  var waitMs=(lastInterval-elapsed)*1000;
  if(waitMs>0) await wheelSleep(waitMs);

  // 5. 最终停止（最后tick到爆炸的间隔）
  await wheelSleep((WHEEL_DRAW_STOP_TIME-WHEEL_DRAW_TICKS[WHEEL_DRAW_TICKS.length-1])*1000);
  wheelState.markerPos=targetIdx;
  wheelSpawnLandEffect(reward.x,reward.y);
  playWheelActionSfx();

  // 6. 等音频余韵结束后打开离恨烟的恭喜获得页面
  await wheelSleep((WHEEL_DRAW_RESULT_TIME-WHEEL_DRAW_STOP_TIME)*1000);
  if(wheelState.drawn.indexOf(targetIdx)===-1) wheelState.drawn.push(targetIdx);
  wheelUpdateCheckMarks();
  // 轮盘动画结束，显示预加载好的gacha_single.html并发送奖励信息
  if(wheelState.gachaPreloaded){
    wheelState.gachaPreloaded = false;

// 从指定概率池中抽奖
function drawFromPool(pool){
  var totalWeight = 0;
  for(var i = 0; i < pool.length; i++){
    totalWeight += pool[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < pool.length; i++){
    cumulative += pool[i].weight;
    if(random < cumulative){
      return pool[i];
    }
  }
  return pool[pool.length - 1];
}

    if(multiModal) multiModal.classList.remove('show');
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe){
      multiIframe.onload = null;
      setTimeout(function(){
        multiIframe.src = 'about:blank';
        // 显示下一批
        setTimeout(function(){
          showWarehouseBatch(warehouseCurrentBatch);
        }, 100);
      }, 200);
    }else{
      showWarehouseBatch(warehouseCurrentBatch);
    }
    return;
  }
  
  // 所有批次都确认完了，把所有已确认的道具加入仓库
  var itemsToAdd = warehouseConfirmedItems.slice();
  itemsToAdd.forEach(function(newItem){
    var existing = warehouseItems.find(function(x){ return x.name === newItem.name; });
    if(existing){
      existing.count = (existing.count || 1) + (newItem.count || 1);
    }else{
      warehouseItems.push(newItem);
    }
  });
  
  // 从暂存箱扣除道具（支持count>1的情况）
  var itemsToDeduct = {};
  itemsToAdd.forEach(function(item){
    if(!itemsToDeduct[item.name]){
      itemsToDeduct[item.name] = 0;
    }
    itemsToDeduct[item.name] += (item.count || 1);
  });
  
  for(var deductName in itemsToDeduct){
    var countToDeduct = itemsToDeduct[deductName];
    for(var j = storageItems.length - 1; j >= 0; j--){
      if(storageItems[j].name === deductName){
        if(storageItems[j].count && storageItems[j].count > countToDeduct){
          storageItems[j].count -= countToDeduct;
        }else{
          storageItems.splice(j, 1);
        }
        break;
      }
    }
  }
  
  // 重置状态
  pendingWarehouseItems = [];
  warehouseAllItems = [];
  warehouseCurrentBatch = 0;
  warehouseTotalBatches = 0;
  warehouseConfirmedItems = [];
  
  // 通知暂存箱页面更新
  setTimeout(function(){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'sendToWarehouseSuccess', items: storageItems}, '*');
    }
  }, 50);
  
  // 最后关闭多道具显示页面
  setTimeout(function(){
    var multiModal = document.getElementById('warehouseMultiModal');
    if(multiModal) multiModal.classList.remove('show');
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe){
      multiIframe.onload = null;
      setTimeout(function(){
        multiIframe.src = 'about:blank';
      }, 200);
    }
  }, 100);
  
  // 不关闭暂存箱，让用户可以继续操作
}
// 关闭购买抽奖币成功弹窗
function closeBuySuccess(){
  document.getElementById('buySuccessModal').classList.remove('show');
  var iframe = document.getElementById('buySuccessIframe');
  iframe.onload = null;
  setTimeout(function(){
    if(iframe) iframe.src = 'about:blank';
  }, 300);
  // 如果是单道具发放仓库，确认后把道具加入仓库、从暂存箱扣除并关闭
  if(typeof pendingWarehouseItems !== 'undefined' && pendingWarehouseItems.length === 1){
    confirmSendToWarehouse();
  }
}
</script>

// 强制解码图片（用canvas绘制，确保图片解码完成）
function forceDecodeImage(img) {
  return new Promise(function(resolve) {
    try {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = img.naturalWidth || img.width || 1;
      canvas.height = img.naturalHeight || img.height || 1;
      ctx.drawImage(img, 0, 0);
    } catch(e) {}
    resolve();
  });
}

// 预加载关键子页面（隐藏的iframe，提前加载HTML和JS）
function preloadKeyPages() {
  var keyPages = [
    'pages/gacha_single.html?preload=1',
    'pages/gacha_ten.html?preload=1',
    'pages/storage.html',
    'pages/warehouse.html',

  // 方案A：预加载的iframe保留在DOM中，不移除
  // 用一个全局对象保存预加载的iframe，方便后续复用
  window._preloadedIframes = window._preloadedIframes || {};
  
  keyPages.forEach(function(path) {
    try {
      var iframe = document.createElement('iframe');
      iframe.src = path;
      iframe.style.display = 'none';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = 'none';
      iframe.style.position = 'absolute';
      iframe.style.left = '-9999px';
      iframe.style.top = '-9999px';
      iframe.setAttribute('muted', '');
      iframe.setAttribute('volume', '0');
      iframe.setAttribute('data-preloaded', 'true');
      iframe.setAttribute('data-page', path);
      document.body.appendChild(iframe);
      
      // 保存到全局对象
      window._preloadedIframes[path] = iframe;
      
      // 加载完成后立即静音所有音频，但不移除iframe
      iframe.onload = function() {
        try {
          var audios = iframe.contentDocument.querySelectorAll('audio');
          audios.forEach(function(audio) {
            audio.muted = true;
            audio.volume = 0;
            audio.pause();
          });
        } catch(e) {}
        // 方案A：不移除iframe，保留在DOM中
        // iframe会一直隐藏着，真正打开页面时可以直接复用
      };

  });
}

  if (percent < 30) stageText = '正在加载图片资源··· (' + preloadLoadedCount + '/' + preloadTotalCount + ')';

  if (typeof updateLoading === 'function') {
    updateLoading(percent, stageText);
  }
  
  if (preloadLoadedCount >= preloadTotalCount && !preloadFinished) {
    preloadFinished = true;

// 直接添加道具到仓库（不经过暂存箱，用于gacha_behavior='warehouse'）
function addToWarehouse(item){
  if(!item || !item.name) return;
  // 确保道具图片是小图
  item.image = '../' + window.getItemImage(item.name, 'small');
  // 检查是否已存在相同道具
  var existing = warehouseItems.find(function(x){ return x.name === item.name; });
  if(existing){
    existing.count = (existing.count || 1) + (item.count || 1);
  }else{
    warehouseItems.push(item);
  }
}

function addToStorage(item){
  // 盒子架构：从ITEM_BEHAVIOR读取道具行为配置，不硬编码
  var behavior = (window.ITEM_BEHAVIOR && window.ITEM_BEHAVIOR[item.name]) ? window.ITEM_BEHAVIOR[item.name] : {gacha_behavior: 'storage'};
  var gachaBehavior = behavior.gacha_behavior || 'storage';
  
  // 如果行为是warehouse，直接发送到仓库（不经过暂存箱）
  if(gachaBehavior === 'warehouse'){
    addToWarehouse(item);
    return;
  }
  
  // 如果行为不是storage（如points/none），不放入暂存箱
  if(gachaBehavior !== 'storage'){
    return;

  // 检查是否已存在相同道具
  for(var i = 0; i < storageItems.length; i++){

      storageItems[i].count = (storageItems[i].count || 1) + 1;

    count: 1
  });
}

// ========== 额外加赠逻辑 ==========
// 检查是否满足额外加赠条件（每满十次，包括单抽和十连抽）
function checkBonusEligibility(){
  // 检查从上一次触发到现在，是否跨过了任何10的倍数
  var lastMultiple = Math.floor(lastBonusDrawCount / 10) * 10; // 上一次触发时或之前的最近10的倍数
  var currentMultiple = Math.floor(totalDrawCount / 10) * 10; // 当前次数或之前的最近10的倍数
  if(currentMultiple > lastMultiple && currentMultiple > 0){
    bonusPending = true;
    lastBonusDrawCount = currentMultiple; // 更新上一次触发额外加赠的次数为最近的10的倍数
    // 立刻显示额外加赠提示页面
    openBonusTip();
  }
}

// 进行概率抽奖，获得额外加赠的奖励
function drawBonusReward(){
  var totalWeight = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    totalWeight += BONUS_ITEM_POOL[i].weight;
  }
  var random = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < BONUS_ITEM_POOL.length; i++){
    cumulative += BONUS_ITEM_POOL[i].weight;
    if(random < cumulative){
      return BONUS_ITEM_POOL[i];
    }
  }
  return BONUS_ITEM_POOL[BONUS_ITEM_POOL.length - 1];
}

// 打开额外加赠提示页面

}

  openBonusReward();
  return;
  if(bonusCurrentReward){
    // 统一用getItemImage函数获取图片，支持带数量的道具名称（如"近战夺宝积分×3"、"99钻石宝箱×1"）
    // 有出货动画的道具用showcase大图，没有的用bonus小图
    var imgType = needShowcase(bonusCurrentReward) ? 'showcase' : 'bonus';
    bonusCurrentReward.image = '../' + window.getItemImage(bonusCurrentReward.name, imgType);
    // 从ITEM_MAPPING获取品质，如果没有则默认gold
    var cleanName = bonusCurrentReward.name ? bonusCurrentReward.name.replace(/[×*]\d+$/, '') : '';
    if(window.ITEM_MAPPING && window.ITEM_MAPPING[cleanName]){
      bonusCurrentReward.quality = window.ITEM_MAPPING[cleanName].quality;
    }else if(window.ITEM_MAPPING && window.ITEM_MAPPING[bonusCurrentReward.name]){
      bonusCurrentReward.quality = window.ITEM_MAPPING[bonusCurrentReward.name].quality;
    }else{
      bonusCurrentReward.quality = 'gold';
    }
  }
  
  // 判断是否需要出货动画（跟单抽出有出货动画的道具一样的逻辑）
  if(needShowcase(bonusCurrentReward)){
    // 需要出货动画，构造item对象，调用showSendToWarehouseReward函数
    var item = {
      name: bonusCurrentReward.name,
      quality: bonusCurrentReward.quality || 'gold',
      image: bonusCurrentReward.image,
      showcase: true,
      count: 1
    };
    // 重置特殊奖池状态
    bonusPending = false;
    isBonusActive = false;
    bonusCurrentReward = null;
    // 调用showSendToWarehouseReward函数，显示出货动画（跟单抽出有出货动画的道具一样的逻辑）
    showSendToWarehouseReward([item]);

    // 不需要出货动画，继续使用原来的逻辑

  var modal = document.getElementById('bonusRewardModal');
  modal.classList.remove('show');
  playRewardSound(); // 播放恭喜获得页面音效（在主页面中播放，不受iframe自动播放策略限制）
  iframe.src = 'pages/bonus_reward.html?t=' + Date.now();
  iframe.onload = function(){
    try{
      iframe.contentWindow.postMessage({type: 'setBonusReward', item: bonusCurrentReward}, '*');
    }catch(e){}
    setTimeout(function(){
      modal.classList.add('show');
    }, 100);
  };
}

// 关闭额外加赠奖励展示页面，将奖励添加到暂存箱
function closeBonusReward(){
  var iframe = document.getElementById('bonusRewardIframe');
  var modal = document.getElementById('bonusRewardModal');
  modal.classList.remove('show');
  iframe.onload = null;
  setTimeout(function(){
    iframe.src = 'about:blank';
    // 处理奖励
    if(bonusCurrentReward){
      var item = bonusCurrentReward;
      // 盒子架构：从ITEM_BEHAVIOR读取道具行为配置，不硬编码
      var behavior = (window.ITEM_BEHAVIOR && window.ITEM_BEHAVIOR[item.name]) ? window.ITEM_BEHAVIOR[item.name] : {bonus_behavior: 'warehouse'};
      var bonusBehavior = behavior.bonus_behavior || 'warehouse';
      
      if(bonusBehavior === 'points'){
        // 积分类道具：增加对应积分数量
        var pointsType = behavior.points_type || 'exchange';
        var pointsAmount = behavior.points_amount || 1;
        if(pointsType === 'exchange'){
          pointsCount += pointsAmount;
          updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
        }
        // 其他积分类型可以在这里扩展
      }else if(bonusBehavior === 'warehouse'){
        // 其他道具直接发送到仓库
        if(window.ITEM_MAPPING && window.ITEM_MAPPING[item.name]){
          item.image = '../' + window.getItemImage(item.name, 'small');
          item.quality = window.ITEM_MAPPING[item.name].quality;
        }
        var existing = warehouseItems.find(function(x){ return x.name === item.name; });
        if(existing){
          existing.count = (existing.count || 1) + (item.count || 1);
        }else{
          warehouseItems.push(item);
        }
      }else if(bonusBehavior === 'storage'){
        // 放入暂存箱
        addToStorage(item);
      }
      // bonus_behavior === 'none' 时，什么都不做
      bonusCurrentReward = null;
    }
    bonusPending = false;
    isBonusActive = false; // 释放状态锁，允许用户进行其他操作
  }, 300);
}

window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'gachaClose'){
    // 王者轮回：分解得到轮回币而不是积分（如果有points字段，当作轮回币处理）
    if(e.data.points && e.data.points > 0){
      gachaCoinCount += e.data.points;
      updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
    }
    // 把获得的奖励存入暂存箱
    if(e.data.rewards && e.data.rewards.length > 0){
      for(var i = 0; i < e.data.rewards.length; i++){
        addToStorage(e.data.rewards[i]);
      }
    }
    // 关闭gachaSingleModal
    if(typeof closeGachaSingle === 'function') closeGachaSingle();
  }
  if(e.data && e.data.type === 'closeReward') closeReward();
  if(e.data && e.data.type === 'closeStorage') closeStorage();
  if(e.data && e.data.type === 'closeWarehouse') closeWarehouse();
  if(e.data && e.data.type === 'warehouseMultiConfirm'){ confirmSendToWarehouse(); }
  if(e.data && e.data.type === 'requestWarehouseItems'){
    var multiIframe = document.getElementById('warehouseMultiIframe');
    if(multiIframe && multiIframe.contentWindow){
      multiIframe.contentWindow.postMessage({type:'setWarehouseItems', items: pendingWarehouseItems}, '*');
    }
  }
  if(e.data && e.data.type === 'sendToWarehouse'){
    var itemsToSend = e.data.items || [];
    // 显示发放仓库恭喜获得页面
    showSendToWarehouseReward(itemsToSend);
  }
  if(e.data && e.data.type === 'closeDecomposeReward') closeDecomposeReward();
  if(e.data && e.data.type === 'bonusTipConfirm') closeBonusTip(e.data.selectedReward);
  if(e.data && e.data.type === 'bonusRewardConfirm') closeBonusReward();
  if(e.data && e.data.type === 'requestPoints'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'requestGachaCoin'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'updateGachaCoin', count: gachaCoinCount}, '*');
    }
  }
  if(e.data && e.data.type === 'requestStorageData'){
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'storageData', items: storageItems, points: pointsCount}, '*');
    }
  }
  if(e.data && e.data.type === 'decomposeItems'){
    var points = e.data.points || 0;
    var items = e.data.items || [];
    // 王者轮回：分解得到轮回币（抽奖币），不是积分
    if(points > 0){
      gachaCoinCount += points;
      updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
    }
    // 从暂存箱中删除已分解的道具
    for(var i = 0; i < items.length; i++){
      for(var j = storageItems.length - 1; j >= 0; j--){
        if(storageItems[j].name === items[i].name){
          storageItems.splice(j, 1);
          break;
        }
      }
    }
    // 显示恭喜获得页面（复用购买成功弹窗样式）
    if(points > 0){
      showDecomposeRewardNew(points);
    }
    // 重新发送数据给暂存箱页面
    var storageIframe = document.getElementById('storageIframe');
    if(storageIframe && storageIframe.contentWindow){
      storageIframe.contentWindow.postMessage({type:'decomposeSuccess', items: storageItems, gachaCoin: gachaCoinCount}, '*');
    }
  }
  if(e.data === 'closeGachaSingle'){
    closeGachaSingle();
  }else if(e.data === 'closeGachaTen'){
    closeGachaTen();
  }else if(e.data && e.data.type === 'gachaClose'){
    // 根据当前抽奖类型调用对应的关闭函数，避免同时调用两个导致竞态
    if(currentGachaType === 'single'){
      closeGachaSingle();
    }else if(currentGachaType === 'ten'){
      closeGachaTen();
    }
  }
  if(e.data && e.data.type === 'closeExchange'){
    playBackSound(); // 播放返回音效
    document.getElementById('exchangeModal').classList.remove('active');
  }
  if(e.data && e.data.type === 'closeRecharge') closeRecharge();
  if(e.data && e.data.type === 'requestCfmCoin'){
    updateCfmCoinDisplay();
  }
  if(e.data && e.data.type === 'openPayment'){
    openPayment(e.data.tier);
  }
  if(e.data && e.data.type === 'closePayment'){
    closePayment();
  }
  if(e.data && e.data.type === 'openExchangeConfirm'){
    openExchangeConfirm(e.data.product, e.data.price, e.data.qty);
  }
  if(e.data && e.data.type === 'closeExchangeConfirm'){
    closeExchangeConfirm();
  }
  if(e.data && e.data.type === 'exchangeConfirm'){
    // 执行兑换逻辑
    doExchange();
  }
  if(e.data && e.data.type === 'paymentSuccess'){
    var tierCoinsList = [3, 6, 30, 68, 128, 198, 328, 648];
    var coins = tierCoinsList[currentPaymentTier] || 1296;
    cfmCoinCount += coins;
    updateCfmCoinDisplay();
    // 不关闭弹窗，等用户点击成功提示页面后再关闭
  }
  if(e.data && e.data.type === 'tryBuy'){
    // 直接打开二次确认页面，CFM币检查放在确认购买后
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'openConfirm'){
    currentBuyTier = parseInt(e.data.tier) || 0;
    openConfirm();
  }
  if(e.data && e.data.type === 'closeBuySuccess'){
    closeBuySuccess();
  }
  if(e.data && e.data.type === 'closeConfirm'){
    closeConfirm();
    if(e.data.action === 'confirm'){
      var tierConfig = BUY_TIERS[currentBuyTier] || BUY_TIERS[0];
      var addCoins = tierConfig.reward_count;
      var costCoins = tierConfig.price;
      if(cfmCoinCount < costCoins){
        // CFM不够，关闭购买页面并打开充值页面
        setTimeout(function(){ closeShop(); openRecharge(); }, 100);
      } else {
        // CFM足够，扣除CFM币并增加抽奖币
        gachaCoinCount += addCoins;
        cfmCoinCount -= costCoins;
        updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
        updateCfmCoinDisplay();
        // 显示恭喜获得弹窗
        setTimeout(function(){ showBuySuccess(addCoins); }, 200);
      }
    }
  }
});
</script>

@keyframes flashBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3);}40%{opacity:0.9;transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(2);}}
@keyframes rayExpand{0%{opacity:0.8;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(25deg);}}
@keyframes glowFade{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}
@keyframes ringExpand{0%{transform:translate(-50%,-50%) scale(0.5);opacity:1;}100%{transform:translate(-50%,-50%) scale(4);opacity:0;}}
@keyframes particleFly{0%{transform:translate(-50%,-50%) rotate(45deg) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(45deg) scale(0.2);opacity:0;}}
@keyframes trailFade{0%{opacity:0.8;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}}

@keyframes landBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3);}50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5);}}
.land-flash{position:absolute;z-index:16;border-radius:50%;background:radial-gradient(circle,rgba(255,255,200,0.95) 0%,rgba(255,200,50,0.6) 25%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);animation:landFlash 0.8s ease-out forwards;}
@keyframes landFlash{0%{width:20px;height:20px;opacity:1;}100%{width:350px;height:350px;opacity:0;}}
.land-ring{position:absolute;z-index:16;border-radius:50%;border:3px solid rgba(255,215,0,0.8);pointer-events:none;transform:translate(-50%,-50%);animation:landRing 1s ease-out forwards;}
@keyframes landRing{0%{width:30px;height:30px;opacity:1;}100%{width:280px;height:280px;opacity:0;}}
.land-particle{position:absolute;z-index:17;width:8px;height:8px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);}
.screen-flash{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at center,rgba(255,220,100,0.45) 0%,transparent 60%);pointer-events:none;opacity:0;}
.screen-flash.go{animation:screenFlash 0.5s ease-out;}
@keyframes screenFlash{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.btn-layer{position:absolute;inset:0;z-index:10;pointer-events:none;}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:8px;transition:transform 0.1s;}
.hotspot:active{transform:scale(0.95);}
.currency-display{position:absolute;z-index:20;color:#fff;font-size:34px;font-weight:bold;text-shadow:0 2px 4px rgba(0,0,0,0.8);pointer-events:none;display:flex;align-items:center;gap:6px;}
.modal-mask{position:absolute;inset:0;z-index:100;background:rgba(5,3,15,0.9);display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.page-modal{position:absolute;inset:0;z-index:150;background-size:100% 100%;background-position:center;display:none;}
.page-modal.show{display:block;}
.page-close{position:absolute;left:0;top:100px;width:160px;height:140px;background:transparent;border:none;cursor:pointer;z-index:20;}
.page-content{position:absolute;inset:0;}
.reward-modal{position:fixed;inset:0;z-index:500;display:none;background:#000}
.reward-modal.show{display:block}
.reward-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.warehouse-modal{position:fixed;inset:0;z-index:500;display:none;background:#000}
.warehouse-modal.show{display:block}
.warehouse-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.storage-modal{position:fixed;inset:0;z-index:500;display:none;background:#000}
.storage-modal.show{display:block}
.storage-modal iframe{width:100%;height:100%;border:none;display:block;background:#000}
.modal-box{width:85%;height:85%;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative;}

.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;z-index:2;}
.modal-title{font-size:36px;font-weight:bold;color:#fff;letter-spacing:4px;text-shadow:0 2px 8px rgba(0,0,0,0.8);}
.modal-close{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-body{flex:1;overflow-y:auto;padding:30px 40px;z-index:2;}
.modal-body::-webkit-scrollbar{width:8px;}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px;}

<script>
var shopTpl = document.getElementById('shopTpl').value;

/* ===== 购买：完全独立 ===== */
function openShop(){
  var iframe = document.getElementById('shopIframe');
  var modal = document.getElementById('shopModal');
  // 先清空iframe，避免多次打开累积内容导致黑屏
  iframe.srcdoc = '';
  iframe.onload = function(){
    // 只有当srcdoc是shopTpl时才显示，避免清空时触发onload
    if(iframe.srcdoc && iframe.srcdoc.length > 100){
      modal.className = 'shop-modal shop-show';
    }
  };
  // 从 BUY_TIERS 生成价格数组，替换模板里的硬编码（确保改动 buy_tiers.js 后显示价格同步更新）
  var tierPricesStr = BUY_TIERS.map(function(t){ return t.price; }).join(', ');
  var shopHtml = shopTpl.replace('var tierPrices = [6, 50, 328, 648];', 'var tierPrices = [' + tierPricesStr + '];');
  // 延迟设置srcdoc，确保先清空
  setTimeout(function(){
    iframe.srcdoc = shopHtml;
  }, 10);
  // 超时保护，确保一定能显示
  setTimeout(function(){
    if(!modal.classList.contains('shop-show')){
      modal.className = 'shop-modal shop-show';
    }
  }, 500);
}
function closeShop(){
  // 关闭音效已在shopTpl的关闭按钮click事件中播放（零帧起手），这里不再重复播放
  var modal = document.getElementById('shopModal');
  var iframe = document.getElementById('shopIframe');
  modal.className = 'shop-modal';
  // 延迟清空iframe，确保隐藏动画完成后再清空
  setTimeout(function(){
    iframe.srcdoc = '';
  }, 300);
}
/* ===== 充值弹窗：完全独立 ===== */
function openRecharge(){
  playOpenSound(); // 播放打开音效
  var modal = document.getElementById('rechargeModal');
  var iframe = document.getElementById('rechargeIframe');
  iframe.onload = function(){
    modal.className = 'recharge-modal recharge-show';
    updateCfmCoinDisplay();
  };
  iframe.src = 'pages/recharge.html?t=' + Date.now();
  setTimeout(function(){
    if(!modal.classList.contains('recharge-show')){
      modal.className = 'recharge-modal recharge-show';
    }
  }, 300);
}
function closeRecharge(){
  playBackSound(); // 播放关闭音效
  document.getElementById('rechargeModal').className = 'recharge-modal';
}
/* ===== 二次确认弹窗：完全独立 ===== */
function openConfirm(){
  var modal = document.getElementById('confirmModal');
  var iframe = document.getElementById('confirmIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    modal.className = 'confirm-modal confirm-show';
  };
  iframe.src = 'pages/confirm.html?t=' + Date.now();
  setTimeout(function(){
    if(!loaded){
      modal.className = 'confirm-modal confirm-show';
    }
  }, 800);
}
function closeConfirm(){
  document.getElementById('confirmModal').className = 'confirm-modal';
  var iframe = document.getElementById('confirmIframe');
  iframe.onload = null;
  iframe.src = 'about:blank';
}
/* ===== 支付方式选择弹窗：完全独立 ===== */

  currentPaymentTier = tier || 7;
  var modal = document.getElementById('paymentModal');
  var iframe = document.getElementById('paymentIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    modal.className = 'payment-modal payment-show';
    // 传递档位信息给iframe
    setTimeout(function(){
      try{
        iframe.contentWindow.postMessage({type:'setTier', tier: currentPaymentTier}, '*');
      }catch(e){}
    }, 100);
  };
  iframe.src = 'pages/buy_confirm.html?tier=' + currentPaymentTier + '&t=' + Date.now();

      modal.className = 'payment-modal payment-show';
      try{

  iframe.onload = null;
  iframe.src = 'about:blank';
}
/* ===== 兑换成功弹窗：完全独立 ===== */
function openExchangeConfirm(product, price, qty){
  // 保存当前兑换信息
  currentExchangeProduct = product || '';
  currentExchangePrice = price || 0;
  currentExchangeQty = qty || 1;
  
  var modal = document.getElementById('exchangeConfirmModal');
  var iframe = document.getElementById('exchangeConfirmIframe');
  var loaded = false;
  iframe.onload = function(){
    loaded = true;
    // 向兑换确认页面传递兑换信息

}

  var mask = document.getElementById('exchangeFailMask');
  if(mask){
    document.getElementById('exchangeFailTitle').textContent = title || '兑换失败';
    document.getElementById('exchangeFailMsg').textContent = msg || '兑换币不足';

      exchangeModal.className = 'exchange-modal active';

    mask.style.display = 'flex';
  }
}

    var exchangeModal = document.getElementById('exchangeModal');
    if(exchangeModal && !exchangeModal.classList.contains('active')){
      exchangeModal.className = 'exchange-modal active';
    }
  }
}



// 执行兑换逻辑
function doExchange(){
  if(!currentExchangeProduct){
    closeExchangeConfirm();
    return;
  }
  
  var totalCost = currentExchangePrice * currentExchangeQty;
  
  // 检查兑换币是否足够
  if(pointsCount < totalCost){
    closeExchangeConfirm();
    // 延迟一点显示失败弹窗，确保兑换确认弹窗完全关闭
    setTimeout(function(){
      showExchangeFail('兑换失败', '需要' + totalCost + '兑换币，当前只有' + pointsCount + '兑换币');
    }, 100);
    return;
  }
  
  // 扣除兑换币
  pointsCount -= totalCost;
  updateGachaCoinDisplay();
  updateWangzheStoneDisplay();
  updateDrawCostDisplay();
  // 通知兑换商城更新兑换币显示
  try{
    var exchangeIframe = document.getElementById('exchangeIframe');
    if(exchangeIframe && exchangeIframe.contentWindow){
      exchangeIframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }
  }catch(e){}
  
  // 获取道具信息
  var itemInfo = findExchangeItem(currentExchangeProduct);
  
  // 构造道具对象
  var item = {
    name: itemInfo.name || currentExchangeProduct,
    count: currentExchangeQty,
    quality: itemInfo.quality,
    image: itemInfo.image,
    showcase: itemInfo.showcase || false
  };
  
  // 关闭兑换确认弹窗
  closeExchangeConfirm();
  
  // 显示恭喜获得页面（参考暂存箱发放仓库单个道具的代码）
  showSendToWarehouseReward([item]);
}

/* ===== 监听postMessage ===== */
window.addEventListener('message', function(e){
  if(e.data === 'closeShop') closeShop();
});
</script>
<script>
function openExchange(){
  var modal = document.getElementById('exchangeModal');
  var iframe = document.getElementById('exchangeIframe');
  modal.className = 'exchange-modal active';
  // 传递兑换币数量给兑换商城
  setTimeout(function(){
    try{
      iframe.contentWindow.postMessage({type:'updatePoints', points: pointsCount}, '*');
    }catch(e){}
  }, 300);
  setTimeout(function(){
    try{
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      var closeBtn = doc.querySelector('.exchange-close') || doc.getElementById('exchangeClose');
      if(closeBtn) closeBtn.addEventListener('click', closeExchange);
      var backBtn = doc.querySelector('[data-name="返回"]') || doc.querySelector('.back');
      if(backBtn) backBtn.addEventListener('click', closeExchange);
    }catch(e){ console.log('绑定关闭按钮失败:', e); }
  }, 500);
}
function closeExchange(){
  document.getElementById('exchangeModal').className = 'exchange-modal';
}
document.querySelector('[data-name="兑换"]').addEventListener('click', openExchange);

// ===== 重置功能（灰蓝金属风格弹窗） =====
function confirmReset(){
  var mask = document.getElementById('resetConfirmMask');
  if(mask) mask.style.display = 'flex';
}
function closeResetConfirm(){
  var mask = document.getElementById('resetConfirmMask');
  if(mask) mask.style.display = 'none';
}
function doReset(){
  // 重置抽奖进度
  wheelState.drawCount = 0;
  wheelState.drawn = [];
  wheelState.markerPos = 0;
  wheelState.stoneBonusGiven = false;
  // 更新勾选标记
  if(typeof wheelUpdateCheckMarks === 'function') wheelUpdateCheckMarks();
  // 更新数字显示
  if(typeof updateDrawCostDisplay === 'function') updateDrawCostDisplay();
  // 关闭弹窗
  closeResetConfirm();
  console.log('已重置抽奖进度');
}

// ===== 王者之石加赠功能 =====
function showWangzheStoneBonus(){
  var mask = document.getElementById('wangzheStoneBonusMask');
  if(mask) mask.style.display = 'flex';
}
function closeWangzheStoneBonus(){
  var mask = document.getElementById('wangzheStoneBonusMask');
  if(mask) mask.style.display = 'none';
}
// 检查是否一轮抽完（10个道具），如果是则给王者之石
function checkWangzheStoneBonus(){
  if(wheelState.drawCount >= 10 && !wheelState.stoneBonusGiven){
    wangzheStoneCount += 1;
    wheelState.stoneBonusGiven = true;
    updateWangzheStoneDisplay();
    // 延迟显示加赠提示（等恭喜获得页面关闭后）
    setTimeout(function(){
      showWangzheStoneBonus();
    }, 500);
  }
}
